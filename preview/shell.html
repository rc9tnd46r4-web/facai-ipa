<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发财 · 原生外壳预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #26262b; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .device {
    position: relative; width: 390px; height: 844px; background: #08080f; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .statusbar {
    height: 59px; flex: 0 0 59px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 26px 8px; color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .2px;
    background: #08080f;
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .statusbar .bars { display: flex; align-items: flex-end; gap: 2px; height: 11px; }
  .statusbar .bars i { display: block; width: 3px; background: #fff; border-radius: 1px; }
  .content { flex: 1 1 auto; position: relative; background: #08080f; }
  .content iframe { width: 100%; height: 100%; border: 0; display: block; background: #08080f; }
  .tabbar {
    flex: 0 0 60px; display: flex; align-items: stretch;
    background: #0c0c17; border-top: .5px solid rgba(255,255,255,.07);
  }
  .tab-item {
    flex: 1 1 20%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding-top: 5px; background: none; border: 0; cursor: pointer;
    color: #6e6e8c; font-family: inherit; transition: color .15s;
  }
  .tab-item .icol { width: 34px; height: 23px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .tab-item svg { width: 19px; height: 19px; display: block; }
  .tab-item.on .icol { background: rgba(167,139,250,.14); }
  .tab-item .l1 { font-size: 10px; line-height: 1.15; font-weight: 600; margin-top: 2px; }
  .tab-item .l2 { font-size: 10px; line-height: 1.15; font-weight: 400; letter-spacing: -.2px; }
  .tab-item.on { color: #a78bfa; }
  .tab-item.on .l1 { font-weight: 700; }
  .homearea { flex: 0 0 34px; background: #0c0c17; display: flex; justify-content: center; align-items: center; }
  .homearea span { width: 134px; height: 5px; border-radius: 3px; background: #f2f2f7; opacity: .85; }
</style>
</head>
<body>
<div class="device">
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>
      <span>5G</span>
      <span style="font-size:11px">100%</span>
    </span>
  </div>
  <div class="content"><iframe id="f" src="../Web/liancuo.html"></iframe></div>
  <nav class="tabbar" id="bar">
    <button class="tab-item on" data-src="../Web/liancuo.html">
      <span class="icol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9.2"/><path d="M9 8.5l6 7M15 15.5h-4.2M15 15.5V11" stroke-linecap="round"/></svg></span>
      <span class="l1">十维</span><span class="l2">连错</span>
    </button>
    <button class="tab-item" data-src="../Web/liancuov2.html">
      <span class="icol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M9.2 8.6l5.6 6.6M14.8 15.2h-4V11" stroke-linecap="round"/></svg></span>
      <span class="l1">十维</span><span class="l2">连错V2</span>
    </button>
    <button class="tab-item" data-src="../Web/liandui.html">
      <span class="icol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9.2"/><path d="M9 15.5l6-7M15 8.5h-4.2M15 8.5V13" stroke-linecap="round"/></svg></span>
      <span class="l1">十维</span><span class="l2">连对</span>
    </button>
    <button class="tab-item" data-src="../Web/lianduiv2.html">
      <span class="icol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M9.2 15.4l5.6-6.6M14.8 8.8h-4V13" stroke-linecap="round"/></svg></span>
      <span class="l1">十维</span><span class="l2">连对V2</span>
    </button>
    <button class="tab-item" data-src="../Web/shengxiao.html">
      <span class="icol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v2.4M12 17.8v2.4M3.8 12h2.4M17.8 12h2.4"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></span>
      <span class="l1">853</span><span class="l2">生肖</span>
    </button>
  </nav>
  <div class="homearea"><span></span></div>
</div>
<script>
  var bar = document.getElementById('bar');
  var frame = document.getElementById('f');
  bar.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab-item');
    if (!btn) return;
    bar.querySelectorAll('.tab-item').forEach(function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
    frame.src = btn.dataset.src;
  });
  window.selectTab = function (i) {
    var btns = bar.querySelectorAll('.tab-item');
    btns[i].click();
  };
</script>
</body>
</html>
