<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #241a44 0%, #14101f 45%, #0a0812 100%);
    font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    padding: 30px 26px 34px;
  }
  h1 { color:#f5f2ff; font-size:26px; font-weight:800; letter-spacing:1px; }
  h1 span { color:#a78bfa; }
  .sub { color:#8b86a8; font-size:13px; margin:6px 0 22px; }
  .row { display:flex; gap:18px; align-items:flex-start; }
  figure { width: 268px; }
  figure img { width:100%; display:block; border-radius:22px; box-shadow:0 18px 40px rgba(0,0,0,.5); }
  figcaption { color:#cfc9e8; font-size:13px; text-align:center; margin-top:10px; font-weight:600; }
  figcaption i { display:block; color:#7c779a; font-style:normal; font-size:11px; font-weight:400; margin-top:2px; }
</style></head>
<body>
  <h1>发财 <span>· 5 版本合体</span></h1>
  <div class="sub">iPhone 390×844 渲染检查（底部 5 Tab，两行文字标签）</div>
  <div class="row">
    <figure><img src="shots/1-十维连错-top.png"><figcaption>十维 / 连错<i>Tab 1</i></figcaption></figure>
    <figure><img src="shots/2-十维连错V2-top.png"><figcaption>十维 / 连错V2<i>Tab 2</i></figcaption></figure>
    <figure><img src="shots/3-十维连对-top.png"><figcaption>十维 / 连对<i>Tab 3</i></figcaption></figure>
    <figure><img src="shots/4-十维连对V2-top.png"><figcaption>十维 / 连对V2<i>Tab 4</i></figcaption></figure>
    <figure><img src="shots/5-853生肖-top.png"><figcaption>853 / 生肖<i>Tab 5</i></figcaption></figure>
  </div>
</body></html>
