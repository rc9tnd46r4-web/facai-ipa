<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:1024px; overflow:hidden; }
  .icon {
    width:1024px; height:1024px; position:relative; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(120% 100% at 20% 0%, #4b2a86 0%, #2a1857 38%, #150c2e 74%, #0a0718 100%);
  }
  .glow {
    position:absolute; width:760px; height:760px; border-radius:50%;
    background: radial-gradient(circle, rgba(167,139,250,.42) 0%, rgba(167,139,250,0) 68%);
    top:60px;
  }
  .ring {
    position:absolute; width:660px; height:660px; border-radius:50%;
    border:3px solid rgba(251,191,36,.28);
  }
  .txt {
    position:relative; font-family:"Microsoft YaHei","PingFang SC",sans-serif; font-weight:900;
    font-size:520px; line-height:1; letter-spacing:-10px;
    background:linear-gradient(150deg,#fff3c4 0%,#fbbf24 38%,#f59e0b 68%,#fde68a 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 0 60px rgba(251,191,36,.35);
    transform:translateY(-16px);
  }
  .sub {
    position:absolute; bottom:118px; font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    font-size:96px; letter-spacing:26px; font-weight:700; color:rgba(255,255,255,.82);
    text-indent:26px;
  }
</style></head>
<body>
  <div class="icon">
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="txt">财</div>
    <div class="sub">FA CAI</div>
  </div>
</body></html>
