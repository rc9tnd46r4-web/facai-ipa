name: Facai
options:
  bundleIdPrefix: com.facaiapp
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Facai:
    type: application
    platform: iOS
    sources:
      - path: Facai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facaiapp.facai
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
    info:
      path: Facai/Info.plist
      properties:
        CFBundleDisplayName: 发财
        CFBundleName: Facai
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
schemes:
  Facai:
    build:
      targets:
        Facai: all
    run:
      config: Debug
    archive:
      config: Release
