name: Build Unsigned IPA (Facai 发财)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: 编译并打包未签名 ipa
        run: bash scripts/build_ipa.sh

      - name: 上传 ipa 产物
        uses: actions/upload-artifact@v4
        with:
          name: Facai-unsigned-ipa
          path: build/out/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 构建摘要
        run: |
          {
            echo "### 发财 App 构建完成"
            echo ""
            echo '```'
            ls -lh build/out
            echo '```'
            echo ""
            echo "安装：用爱思助手 / Sideloadly / AltStore 重签后安装（未签名 ipa 无法直接安装）。"
          } >> "$GITHUB_STEP_SUMMARY"
