<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Facai Icon 1024</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1024px; height: 1024px; overflow: hidden; }
  .canvas {
    position: relative;
    width: 1024px;
    height: 1024px;
    background:
      radial-gradient(circle at 26% 18%, #8a6cff 0%, rgba(138,108,255,0) 55%),
      radial-gradient(circle at 82% 88%, #ff7a59 0%, rgba(255,122,89,0) 48%),
      linear-gradient(160deg, #1b1140 0%, #120c2b 46%, #08060f 100%);
    overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 128px 128px;
    mask-image: radial-gradient(circle at 50% 42%, #000 20%, transparent 78%);
  }
  .ring {
    position: absolute;
    left: 50%; top: 47%;
    width: 700px; height: 700px;
    margin: -350px 0 0 -350px;
    border-radius: 50%;
    border: 2px solid rgba(255, 214, 128, .28);
    box-shadow: inset 0 0 90px rgba(255, 190, 90, .10);
  }
  .ring2 {
    position: absolute;
    left: 50%; top: 47%;
    width: 612px; height: 612px;
    margin: -306px 0 0 -306px;
    border-radius: 50%;
    border: 1px dashed rgba(255, 255, 255, .18);
  }
  .glyph {
    position: absolute;
    left: 0; right: 0; top: 47%;
    transform: translateY(-50%);
    text-align: center;
    font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
    font-weight: 900;
    font-size: 470px;
    line-height: 1;
    background: linear-gradient(180deg, #fff6d8 0%, #ffd777 42%, #f0a93c 78%, #d9861f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 14px 40px rgba(255, 170, 60, .45));
  }
  .cap {
    position: absolute;
    left: 0; right: 0; bottom: 132px;
    text-align: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 14px;
    color: rgba(255, 236, 200, .82);
    text-indent: 14px;
  }
  .dots {
    position: absolute;
    left: 0; right: 0; bottom: 96px;
    text-align: center;
    font-size: 22px;
    letter-spacing: 10px;
    color: rgba(167, 139, 250, .85);
  }
  .edge {
    position: absolute; inset: 26px;
    border-radius: 210px;
    border: 3px solid rgba(255,255,255,.10);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid"></div>
    <div class="ring"></div>
    <div class="ring2"></div>
    <div class="glyph">财</div>
    <div class="cap">FA CAI</div>
    <div class="dots">◆ ◆ ◆</div>
    <div class="edge"></div>
  </div>
</body>
</html>
